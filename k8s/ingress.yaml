# Ingress for simple-sso on k3s (Traefik).
#
# HTTP (web) entrypoint only — TLS is terminated upstream by Cloudflare Tunnel.
# Point your Cloudflare Tunnel at Traefik's HTTP NodePort and set the Host header:
#   sso-api.mstdev.my.id  ->  http://<node>:<traefik-web-nodeport>   (Host: sso-api.mstdev.my.id)
#   sso.mstdev.my.id      ->  http://<node>:<traefik-web-nodeport>   (Host: sso.mstdev.my.id)
# (Find the NodePort: kubectl -n kube-system get svc traefik -o wide)
#
# Routing model — the SPA calls the backend at the ABSOLUTE URL https://sso-api.mstdev.my.id
# (set via VITE_API_URL in the ConfigMap), so the two hosts are independent:
#   sso-api.mstdev.my.id/  -> server-service (backend, port 3000)
#   sso.mstdev.my.id/      -> client-service (SPA, port 80)
#
# Entra app registration must list this redirect URI (type Web):
#   https://sso-api.mstdev.my.id/api/auth/oauth/microsoft/callback

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-sso-server-ingress
  namespace: simple-sso
  labels:
    app: monorepo
    component: server
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: sso-api.mstdev.my.id
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: server-service
            port:
              number: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-sso-client-ingress
  namespace: simple-sso
  labels:
    app: monorepo
    component: client
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: sso.mstdev.my.id
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client-service
            port:
              number: 80
