apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
  namespace: simple-sso
  labels:
    app: monorepo
    component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monorepo
      component: server
  template:
    metadata:
      labels:
        app: monorepo
        component: server
    spec:
      containers:
      - name: server
        image: ghcr.io/hbinduni/simple-sso-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        # ConfigMap values
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: monorepo-config
              key: ENVIRONMENT
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: monorepo-config
              key: SERVER_PORT
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: monorepo-config
              key: FRONTEND_URL
              optional: true
        # JWT Authentication (signs the access/refresh tokens we issue)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: monorepo-secret
              key: JWT_SECRET
        # Microsoft Entra ID (Azure AD) OAuth
        - name: AZURE_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: monorepo-secret
              key: AZURE_TENANT_ID
              optional: true
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: monorepo-secret
              key: AZURE_CLIENT_ID
              optional: true
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: monorepo-secret
              key: AZURE_CLIENT_SECRET
              optional: true
        - name: AZURE_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: monorepo-secret
              key: AZURE_REDIRECT_URI
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      # Uncomment if using private registry
      # imagePullSecrets:
      # - name: ghcr-secret
