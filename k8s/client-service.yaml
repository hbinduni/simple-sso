apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: simple-sso
  labels:
    app: monorepo
    component: client
spec:
  # ClusterIP: Traefik (via the Ingress) fronts this service; TLS is terminated
  # upstream by the Cloudflare Tunnel, so no LoadBalancer is needed.
  type: ClusterIP
  selector:
    app: monorepo
    component: client
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  sessionAffinity: None
